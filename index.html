<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPL 2025 • Ticket Booking</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b0f1c 0%, #1a1f2f 100%);
      color: #ffffff;
      padding: 2rem 1.5rem;
      min-height: 100vh;
    }

    /* animated glow */
    .glow-text {
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6), 0 0 20px rgba(255, 140, 0, 0.4);
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    /* header */
    .ipl-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .ipl-logo {
      background: linear-gradient(135deg, #ffd966, #f0b000);
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px #f0b00066;
      font-size: 2rem;
      font-weight: 900;
      color: #0a0e1a;
      letter-spacing: -2px;
    }

    .title h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(to right, #f9e79f, #f7dc6f, #f1c40f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .title p {
      font-size: 0.9rem;
      color: #9aa9c1;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .booking-counter {
      background: #1e2538;
      padding: 0.8rem 1.6rem;
      border-radius: 50px;
      border: 1px solid #ffd96655;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .booking-counter i {
      color: #f1c40f;
      font-size: 1.3rem;
    }

    .counter-text {
      font-weight: 500;
    }

    .counter-text span {
      font-weight: 800;
      color: #f1c40f;
      font-size: 1.3rem;
      margin-left: 6px;
    }

    /* filter / booking tip */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: #151d2c;
      padding: 1rem 2rem;
      border-radius: 60px;
      margin-bottom: 2.8rem;
      border: 1px solid #2e3a4e;
      box-shadow: 0 10px 25px -8px black;
    }

    .filter-bar h3 {
      font-weight: 500;
      font-size: 1.1rem;
      color: #cbd5e6;
    }

    .filter-bar h3 i {
      color: #f1c40f;
      margin-right: 8px;
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid #3f4d66;
      color: #cbd5e6;
      padding: 0.5rem 1.4rem;
      border-radius: 30px;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .filter-btn i {
      margin-right: 6px;
      font-size: 0.8rem;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: #f1c40f;
      border-color: #f1c40f;
      color: #0a0e1a;
      font-weight: 700;
      box-shadow: 0 0 15px #f1c40faa;
    }

    /* Teams Grid */
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 1.8rem;
      margin-bottom: 3rem;
    }

    /* team card */
    .team-card {
      background: linear-gradient(160deg, #121a26, #0e131f);
      border-radius: 28px;
      padding: 1.8rem 1.2rem 1.4rem;
      text-align: center;
      border: 1px solid #2a374b;
      transition: transform 0.25s ease, border-color 0.2s, box-shadow 0.3s;
      box-shadow: 0 18px 30px -12px #000000cc;
      position: relative;
      cursor: pointer;
      backdrop-filter: blur(2px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .team-card:hover {
      transform: translateY(-8px);
      border-color: #f1c40f;
      box-shadow: 0 25px 40px -12px #f1c40f33, 0 0 0 1px #f1c40f55;
    }

    .team-card.selected {
      border: 2px solid #f1c40f;
      box-shadow: 0 0 30px #f1c40f66, 0 20px 30px -12px black;
      background: linear-gradient(160deg, #1b2333, #111927);
    }

    /* team logo */
    .team-logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      background: #0b1018;
      border-radius: 50%;
      padding: 12px;
      margin-bottom: 1rem;
      border: 2px solid #f1c40f77;
      box-shadow: 0 0 18px #f1c40f40;
      transition: 0.2s;
    }

    .team-card:hover .team-logo {
      transform: scale(1.03);
      border-color: #f1c40f;
    }

    .team-name {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
      background: linear-gradient(to right, #fff, #d9e2f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .team-short {
      font-size: 0.85rem;
      color: #8e9eb5;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    /* captain */
    .captain {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #05080e80;
      padding: 0.5rem 1rem 0.5rem 0.8rem;
      border-radius: 50px;
      margin: 0.5rem 0 1rem;
      border: 1px solid #2e405b;
      width: fit-content;
    }

    .captain-img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #f1c40f;
      background: #222;
    }

    .captain-info {
      text-align: left;
    }

    .captain-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: #a6b6d0;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .captain-name {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .price-tag {
      font-size: 1.1rem;
      font-weight: 800;
      color: #f1c40f;
      margin: 0.6rem 0 0.8rem;
      background: #1e2637;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      display: inline-block;
      border: 1px dashed #f1c40f99;
    }

    .price-tag i {
      font-size: 0.9rem;
      margin-right: 4px;
    }

    .book-btn {
      background: linear-gradient(145deg, #f1c40f, #d4a000);
      border: none;
      color: #0b0f1c;
      font-weight: 800;
      padding: 0.8rem 0;
      width: 100%;
      border-radius: 40px;
      font-size: 1rem;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      cursor: pointer;
      box-shadow: 0 8px 18px #d4a00060;
      margin-top: 0.5rem;
    }

    .book-btn i {
      font-size: 1rem;
    }

    .book-btn:hover {
      background: #ffe066;
      box-shadow: 0 10px 25px #ffe066cc;
      transform: scale(1.02);
    }

    .book-btn:disabled,
    .book-btn.disabled {
      background: #3a4357;
      color: #7d8ba3;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
      pointer-events: none;
      opacity: 0.6;
    }

    /* live match ticker (fake) */
    .live-ticker {
      background: #0e141f;
      border-radius: 50px;
      padding: 0.8rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      border: 1px solid #2d3b51;
      box-shadow: inset 0 0 20px #00000055;
      margin-bottom: 2.5rem;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #e74c3c;
      padding: 0.4rem 1.2rem;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    .live-badge i {
      font-size: 0.7rem;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .match-info {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .match-info span {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #b8c7e0;
      font-size: 0.95rem;
    }

    .match-info i {
      color: #f1c40f;
      width: 18px;
    }

    /* booking summary */
    .booking-summary {
      background: #0e141f;
      border-radius: 28px;
      padding: 1.6rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #2a374b;
      box-shadow: 0 20px 30px -12px black;
      margin-top: 1.5rem;
    }

    .summary-detail {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .summary-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1b2333;
      padding: 0.6rem 1.6rem;
      border-radius: 40px;
    }

    .summary-item i {
      font-size: 1.3rem;
      color: #f1c40f;
    }

    .summary-text small {
      display: block;
      font-size: 0.7rem;
      color: #8d9db9;
      letter-spacing: 1px;
    }

    .summary-text strong {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .book-now-btn {
      background: #f1c40f;
      border: none;
      color: #0a0e1a;
      font-weight: 800;
      font-size: 1.2rem;
      padding: 1rem 3rem;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: 0.2s;
      cursor: pointer;
      box-shadow: 0 12px 25px -5px #f1c40faa;
      letter-spacing: 1px;
    }

    .book-now-btn:hover:not(:disabled) {
      background: #ffe066;
      transform: scale(1.02);
      box-shadow: 0 18px 30px -5px #ffe066;
    }

    .book-now-btn:disabled {
      background: #384153;
      color: #7a8aa5;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e2a3a;
      border-left: 6px solid #f1c40f;
      padding: 1rem 2rem;
      border-radius: 16px;
      box-shadow: 0 20px 40px -10px black;
      display: flex;
      align-items: center;
      gap: 15px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
      z-index: 9999;
      font-weight: 500;
      color: #fff;
      backdrop-filter: blur(8px);
      border: 1px solid #f1c40f55;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .toast i {
      color: #f1c40f;
      font-size: 1.6rem;
    }

    /* responsive */
    @media (max-width: 700px) {
      .ipl-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
      .filter-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
        border-radius: 30px;
      }
      .booking-summary {
        flex-direction: column;
        gap: 20px;
        align-items: stretch;
      }
      .book-now-btn {
        justify-content: center;
      }
      .title h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="ipl-header">
    <div class="logo-area">
      <div class="ipl-logo">IPL</div>
      <div class="title">
        <h1 class="glow-text">TICKET BOOKING</h1>
        <p><i class="fas fa-map-pin" style="color:#f1c40f;"></i> SEASON 2025 • LIVE ACTION</p>
      </div>
    </div>
    <div class="booking-counter">
      <i class="fas fa-ticket-alt"></i>
      <div class="counter-text">Available seats: <span id="seatCounter">10</span></div>
    </div>
  </div>

  <!-- Live ticker (fake) -->
  <div class="live-ticker">
    <div class="live-badge"><i class="fas fa-circle"></i> LIVE</div>
    <div class="match-info">
      <span><i class="fas fa-map-marker-alt"></i> Wankhede Stadium, Mumbai</span>
      <span><i class="fas fa-clock"></i> 7:30 PM IST</span>
      <span><i class="fas fa-users"></i> 32,000+ attendance</span>
    </div>
    <div style="color:#f1c40f; font-weight:600;"><i class="fas fa-bolt"></i> MI vs CSK</div>
  </div>

  <!-- Filter buttons -->
  <div class="filter-bar">
    <h3><i class="fas fa-sliders-h"></i> Filter by city</h3>
    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all"><i class="fas fa-star"></i> All</button>
      <button class="filter-btn" data-filter="mumbai"><i class="fas fa-city"></i> Mumbai</button>
      <button class="filter-btn" data-filter="chennai"><i class="fas fa-city"></i> Chennai</button>
      <button class="filter-btn" data-filter="bangalore"><i class="fas fa-city"></i> Bangalore</button>
      <button class="filter-btn" data-filter="kolkata"><i class="fas fa-city"></i> Kolkata</button>
    </div>
  </div>

  <!-- Teams grid (dynamically populated by JS) -->
  <div class="teams-grid" id="teamsGrid"></div>

  <!-- Booking Summary -->
  <div class="booking-summary">
    <div class="summary-detail">
      <div class="summary-item">
        <i class="fas fa-check-circle"></i>
        <div class="summary-text">
          <small>Selected team</small>
          <strong id="selectedTeamName">—</strong>
        </div>
      </div>
      <div class="summary-item">
        <i class="fas fa-tag"></i>
        <div class="summary-text">
          <small>Price per ticket</small>
          <strong id="selectedPrice">₹0</strong>
        </div>
      </div>
    </div>
    <button class="book-now-btn" id="bookNowBtn" disabled>
      <i class="fas fa-credit-card"></i> BOOK NOW
    </button>
  </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast">
  <i class="fas fa-check-circle"></i>
  <span id="toastMessage">Tickets booked successfully!</span>
</div>

<script>
  // ---------- TEAM DATA (with real IPL team logos & captains) ----------
  const teams = [
    {
      id: 'mi',
      name: 'Mumbai Indians',
      short: 'MI',
      city: 'mumbai',
      price: 3499,
      logo: 'https://upload.wikimedia.org/wikipedia/en/thumb/c/cd/Mumbai_Indians_Logo.svg/240px-Mumbai_Indians_Logo.svg.png',
      captain: 'Rohit Sharma',
      captainImg: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Rohit_Sharma_2015.jpg/200px-Rohit_Sharma_2015.jpg'
    },
    {
      id: 'csk',
      name: 'Chennai Super Kings',
      short: 'CSK',
      city: 'chennai',
      price: 2999,
      logo: 'https://upload.wikimedia.org/wikipedia/en/thumb/2/2b/Chennai_Super_Kings_Logo.svg/240px-Chennai_Super_Kings_Logo.svg.png',
      captain: 'MS Dhoni',
      captainImg: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/MS_Dhoni_2016.jpg/200px-MS_Dhoni_2016.jpg'
    },
    {
      id: 'rcb',
      name: 'Royal Challengers Bengaluru',
      short: 'RCB',
      city: 'bangalore',
      price: 3299,
      logo: 'https://upload.wikimedia.org/wikipedia/en/thumb/d/d4/Royal_Challengers_Bengaluru_Logo.svg/240px-Royal_Challengers_Bengaluru_Logo.svg.png',
      captain: 'Faf du Plessis',
      captainImg: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Faf_du_Plessis_2019.jpg/200px-Faf_du_Plessis_2019.jpg'
    },
    {
      id: 'kkr',
      name: 'Kolkata Knight Riders',
      short: 'KKR',
      city: 'kolkata',
      price: 2799,
      logo: 'https://upload.wikimedia.org/wikipedia/en/thumb/4/4c/Kolkata_Knight_Riders_Logo.svg/240px-Kolkata_Knight_Riders_Logo.svg.png',
      captain: 'Shreyas Iyer',
      captainImg: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Shreyas_Iyer_2022.jpg/200px-Shreyas_Iyer_2022.jpg'
    },
    {
      id: 'dc',
      name: 'Delhi Capitals',
      short: 'DC',
      city: 'delhi',
      price: 2599,
      logo: 'https://upload.wikimedia.org/wikipedia/en/thumb/2/2f/Delhi_Capitals_Logo.svg/240px-Delhi_Capitals_Logo.svg.png',
      captain: 'Rishabh Pant',
      captainImg: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Rishabh_Pant_2022.jpg/200px-Rishabh_Pant_2022.jpg'
    },
    {
      id: 'rr',
      name: 'Rajasthan Royals',
      short: 'RR',
      city: 'jaipur',
      price: 2699,
      logo: 'https://upload.wikimedia.org/wikipedia/en/thumb/8/8f/Rajasthan_Royals_Logo.svg/240px-Rajasthan_Royals_Logo.svg.png',
      captain: 'Sanju Samson',
      captainImg: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Sanju_Samson_2022.jpg/200px-Sanju_Samson_2022.jpg'
    }
  ];

  // ---------- STATE ----------
  let selectedTeamId = null;
  let availableSeats = 10;
  const teamsGrid = document.getElementById('teamsGrid');
  const seatCounter = document.getElementById('seatCounter');
  const selectedTeamName = document.getElementById('selectedTeamName');
  const selectedPrice = document.getElementById('selectedPrice');
  const bookNowBtn = document.getElementById('bookNowBtn');
  const toast = document.getElementById('toast');
  const toastMessage = document.getElementById('toastMessage');

  // filter state
  let currentFilter = 'all';

  // ---------- RENDER TEAMS ----------
  function renderTeams(filter = 'all') {
    const filtered = filter === 'all' ? teams : teams.filter(t => t.city === filter);
    // if filter has no teams (like delhi, jaipur) we still show all? we'll extend a bit: for simplicity, if none match, show all.
    const displayTeams = filtered.length ? filtered : teams;

    teamsGrid.innerHTML = displayTeams.map(team => {
      const isSelected = (selectedTeamId === team.id);
      return `
        <div class="team-card ${isSelected ? 'selected' : ''}" data-team-id="${team.id}" data-city="${team.city}">
          <img class="team-logo" src="${team.logo}" alt="${team.name} logo" loading="lazy">
          <div class="team-name">${team.name}</div>
          <div class="team-short">${team.short}</div>
          <div class="captain">
            <img class="captain-img" src="${team.captainImg}" alt="${team.captain}" loading="lazy">
            <div class="captain-info">
              <div class="captain-label">Captain</div>
              <div class="captain-name">${team.captain}</div>
            </div>
          </div>
          <div class="price-tag"><i class="fas fa-rupee-sign"></i> ${team.price.toLocaleString('en-IN')}</div>
          <button class="book-btn" data-book-id="${team.id}">
            <i class="fas fa-ticket-alt"></i> BOOK TICKET
          </button>
        </div>
      `;
    }).join('');

    // attach click events (team card selection)
    document.querySelectorAll('.team-card').forEach(card => {
      card.addEventListener('click', (e) => {
        // if clicked on button, don't toggle selection — button has its own handler
        if (e.target.closest('.book-btn')) return;

        const teamId = card.dataset.teamId;
        selectTeam(teamId);
      });
    });

    // attach events to book buttons (inside cards)
    document.querySelectorAll('.book-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const teamId = btn.dataset.bookId;
        selectTeam(teamId);
        handleBookNow();
      });
    });

    // highlight selected if any
    if (selectedTeamId) {
      const selectedCard = document.querySelector(`.team-card[data-team-id="${selectedTeamId}"]`);
      if (selectedCard) {
        selectedCard.classList.add('selected');
      }
    }
    updateSummary();
  }

  // ---------- SELECT TEAM ----------
  function selectTeam(teamId) {
    const team = teams.find(t => t.id === teamId);
    if (!team) return;

    // toggle selection: if same team, deselect? we keep selected.
    if (selectedTeamId === teamId) {
      // keep selected, maybe do nothing.
    } else {
      selectedTeamId = teamId;
    }

    // update UI: remove selected class from all cards, add to current
    document.querySelectorAll('.team-card').forEach(card => {
      card.classList.remove('selected');
      if (card.dataset.teamId === selectedTeamId) {
        card.classList.add('selected');
      }
    });

    updateSummary();
  }

  // ---------- UPDATE SUMMARY ----------
  function updateSummary() {
    if (selectedTeamId) {
      const team = teams.find(t => t.id === selectedTeamId);
      if (team) {
        selectedTeamName.textContent = team.name;
        selectedPrice.textContent = `₹${team.price.toLocaleString('en-IN')}`;
        bookNowBtn.disabled = false;
      } else {
        selectedTeamName.textContent = '—';
        selectedPrice.textContent = '₹0';
        bookNowBtn.disabled = true;
      }
    } else {
      selectedTeamName.textContent = '—';
      selectedPrice.textContent = '₹0';
      bookNowBtn.disabled = true;
    }
  }

  // ---------- BOOK NOW (main action) ----------
  function handleBookNow() {
    if (!selectedTeamId) {
      showToast('Please select a team first', 'fa-exclamation-circle');
      return;
    }

    if (availableSeats <= 0) {
      showToast('Sorry, no seats available!', 'fa-times-circle');
      return;
    }

    // simulate booking
    const team = teams.find(t => t.id === selectedTeamId);
    availableSeats--;
    seatCounter.textContent = availableSeats;

    showToast(`✅ ${team.short} ticket booked! Check your email.`, 'fa-check-circle');

    // if no seats left, disable all book buttons? we'll handle through UI
    if (availableSeats === 0) {
      document.querySelectorAll('.book-btn').forEach(btn => {
        btn.classList.add('disabled');
        btn.disabled = true;
      });
      bookNowBtn.disabled = true;
      showToast('All tickets sold out!', 'fa-ticket-alt');
    } else {
      // keep button enabled but disable if no seats
    }

    // Optional: deselect after booking? We keep selection for user convenience.
    // But we can also leave it. 
  }

  // ---------- TOAST ----------
  function showToast(msg, icon = 'fa-check-circle') {
    toastMessage.textContent = msg;
    toast.querySelector('i').className = `fas ${icon}`;
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2800);
  }

  // ---------- FILTERS ----------
  function setupFilters() {
    const filterBtns = document.querySelectorAll('.filter-btn');
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        currentFilter = filter;
        // when filtering, if selected team is not in filter, we may keep but visually card not shown.
        // So we deselect to avoid confusion? better to deselect if selected not in filtered.
        if (selectedTeamId) {
          const selectedTeam = teams.find(t => t.id === selectedTeamId);
          if (filter !== 'all' && selectedTeam.city !== filter) {
            // deselect
            selectedTeamId = null;
            updateSummary();
          }
        }
        renderTeams(filter);
      });
    });
  }

  // ---------- INIT ----------
  function init() {
    renderTeams('all');
    setupFilters();
    seatCounter.textContent = availableSeats;

    // book now button
    bookNowBtn.addEventListener('click', handleBookNow);
  }

  init();
</script>

</body>
</html>
